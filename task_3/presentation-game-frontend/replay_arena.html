<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PokerMind — AI Arena Replay</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #172033;
    --panel-2: #1e2a42;
    --line: #2a3a57;
    --text: #e7edf7;
    --muted: #8fa1bd;
    --accent: #4fd1c5;
    --felt: #1d6b4f;
    --felt-2: #14513b;
    --gold: #f0c14b;
    --red: #ff5c72;
    --raise: #f0894b;
    --call: #58a6ff;
    --fold: #8fa1bd;
    --check: #7ee0a6;
    --allin: #ff5c72;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .3px; }
  header .meta { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  button, select {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: #06231f; border-color: var(--accent); font-weight: 600; }

  /* Loader */
  #loader {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; height: calc(100vh - 52px); text-align: center;
  }
  #loader .drop {
    border: 2px dashed var(--line); border-radius: 16px;
    padding: 48px 64px; background: var(--panel);
  }
  #loader p { color: var(--muted); }

  /* App layout */
  #app { display: none; height: calc(100vh - 52px); }
  #controls {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  #controls .grp { display: flex; align-items: center; gap: 6px; }
  #controls .label { color: var(--muted); font-size: 12px; }
  #stepInfo { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  #streetBadge {
    padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: var(--panel-2); border: 1px solid var(--line); text-transform: capitalize;
  }
  input[type=range] { width: 120px; }

  #main { display: grid; grid-template-columns: 1fr 380px; height: calc(100% - 47px); }

  /* Table */
  #tableWrap { position: relative; padding: 24px; overflow: hidden; }
  #table {
    position: relative; width: 100%; height: 100%;
    background: radial-gradient(ellipse at center, var(--felt) 0%, var(--felt-2) 78%);
    border: 12px solid #3b2a1c; border-radius: 46% / 50%;
    box-shadow: inset 0 0 60px rgba(0,0,0,.45), 0 8px 30px rgba(0,0,0,.4);
  }
  #board {
    position: absolute; left: 50%; top: 44%; transform: translate(-50%,-50%);
    display: flex; gap: 8px; align-items: center; min-height: 78px;
  }
  #potInfo {
    position: absolute; left: 50%; top: 62%; transform: translate(-50%,-50%);
    text-align: center;
  }
  #potInfo .pot { font-size: 18px; font-weight: 700; color: var(--gold); }
  #potInfo .blinds { font-size: 12px; color: #d6e4d6; margin-top: 2px; }
  #handTitle {
    position: absolute; left: 50%; top: 26%; transform: translate(-50%,-50%);
    color: #cfe6d5; font-size: 13px; letter-spacing: .4px; text-align: center;
  }
  #centerResult {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    display: none; text-align: center; z-index: 6;
    background: rgba(8,13,22,.94); border: 2px solid var(--gold);
    border-radius: 18px; padding: 22px 34px; box-shadow: 0 12px 50px rgba(0,0,0,.6);
    min-width: 300px;
  }
  #centerResult.show { display: block; animation: popIn .45s ease; }
  #centerResult .cr-champ { font-size: 13px; font-weight: 800; color: var(--gold); letter-spacing: .6px; margin-bottom: 8px; }
  #centerResult .cr-winner { font-size: 23px; font-weight: 800; color: #fff; }
  #centerResult .cr-cat { font-size: 18px; margin: 6px 0 14px; color: var(--gold); font-weight: 700; }
  #centerResult .cr-cat.muted { color: var(--muted); font-weight: 500; font-size: 15px; margin-bottom: 6px; }
  #centerResult .cr-cards { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
  #centerResult .cr-cards .card { width: 54px; height: 74px; }
  #centerResult .cr-cards .card .r { font-size: 21px; }
  #centerResult .cr-cards .card .s { font-size: 19px; }
  #centerResult .cr-award { font-size: 16px; color: var(--gold); font-weight: 700; }
  /* hand-end layout: community board stays visible above the result panel */
  #table.result #board { top: 27%; }
  #table.result #handTitle, #table.result #potInfo { visibility: hidden; }
  #table.result #centerResult { top: 60%; }
  #boardLabel {
    position: absolute; left: 50%; top: 18%; transform: translate(-50%,-50%);
    font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: #cfe6d5;
    display: none;
  }
  #table.result #boardLabel { display: block; }

  .seat {
    position: absolute; width: 176px; transform: translate(-50%,-50%);
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 10px; transition: box-shadow .15s, opacity .15s, border-color .15s;
  }
  .seat.active { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold), 0 0 22px rgba(240,193,75,.5); }
  .seat.folded { opacity: .45; }
  .seat.out { opacity: .28; filter: grayscale(.7); }
  .seat.winner { border-color: var(--check); box-shadow: 0 0 0 2px var(--check), 0 0 22px rgba(126,224,166,.55); }
  .seat .name { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; }
  .seat .stack { color: var(--gold); font-size: 13px; font-variant-numeric: tabular-nums; }
  .seat .cards { display: flex; gap: 5px; margin-top: 6px; }
  .seat .badges { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; min-height: 4px; }
  .posbadge {
    font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
    letter-spacing: .3px;
  }
  .posbadge.btn { background: #f0c14b; color: #3a2c07; border-color: #f0c14b; }
  .posbadge.sb  { background: #58a6ff; color: #06213f; border-color: #58a6ff; }
  .posbadge.bb  { background: #ff8f5c; color: #3a1c07; border-color: #ff8f5c; }
  .lastact {
    margin-top: 6px; font-size: 11px; color: var(--muted); min-height: 14px;
  }
  .tooltag {
    margin-top: 6px; font-size: 11px; font-weight: 700; color: #0a2b28;
    background: var(--accent); border-radius: 6px; padding: 3px 7px; display: inline-block;
    animation: toolpulse 1s ease-in-out infinite;
  }
  @keyframes toolpulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(79,209,197,.6); }
    50% { box-shadow: 0 0 0 6px rgba(79,209,197,0); }
  }
  .toolmark { color: var(--accent); font-size: 11px; margin-left: auto; }

  /* animations */
  @keyframes flipIn { from { transform: rotateY(88deg); opacity: 0; } to { transform: rotateY(0); opacity: 1; } }
  .card.flip { animation: flipIn .38s ease-out backwards; }
  @keyframes dealIn { from { transform: translateY(-16px) scale(.82); opacity: 0; } to { transform: none; opacity: 1; } }
  .card.deal { animation: dealIn .3s ease-out backwards; }
  @keyframes potBump { 0% { transform: translate(-50%,-50%) scale(1); } 35% { transform: translate(-50%,-50%) scale(1.28); } 100% { transform: translate(-50%,-50%) scale(1); } }
  #potInfo.bump { animation: potBump .4s ease; }
  @keyframes winnerCelebrate { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.06); } }
  .seat.winner { animation: winnerCelebrate .85s ease-in-out 2; }
  .card.win-card { outline: 3px solid var(--gold); outline-offset: 1px; box-shadow: 0 0 14px rgba(240,193,75,.75); z-index: 2; }
  .seat { transition: left .35s ease, top .35s ease, opacity .2s ease; }

  /* winning combination + champion */
  .winlabel { font-size: 14px; margin: 4px 0 6px; line-height: 1.4; }
  .winlabel .muted { color: var(--muted); font-weight: 400; }
  .winsub { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 5px; }
  .combo { display: flex; gap: 5px; }
  .champion {
    background: linear-gradient(135deg, #f0c14b, #e0982b); color: #3a2c07;
    font-weight: 700; text-align: center; border-radius: 10px; padding: 12px;
    margin-bottom: 10px; font-size: 14px; line-height: 1.5;
    animation: popIn .5s ease;
  }
  .champion b { font-size: 20px; }
  @keyframes popIn { 0% { transform: scale(.8); opacity: 0; } 60% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .card.flip, .card.deal, #potInfo.bump, .seat.winner, .champion, .tooltag, #centerResult.show { animation: none !important; }
  }

  /* Cards */
  .card {
    width: 42px; height: 58px; border-radius: 6px; background: #fbfbfb; color: #16202e;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 700; box-shadow: 0 2px 5px rgba(0,0,0,.35); position: relative;
    border: 1px solid #d5dae2;
  }
  .card.sm { width: 32px; height: 44px; }
  .card .r { font-size: 17px; line-height: 1; }
  .card.sm .r { font-size: 14px; }
  .card .s { font-size: 15px; line-height: 1; }
  .card.red { color: #d21f3c; }
  .card.back {
    background: repeating-linear-gradient(45deg, #35507e, #35507e 6px, #2a4066 6px, #2a4066 12px);
    color: transparent; border-color: #24365a;
  }

  /* Side panel */
  #side { border-left: 1px solid var(--line); background: var(--bg); overflow-y: auto; padding: 14px; }
  .card-box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .card-box h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  #decAgent { font-size: 16px; font-weight: 700; }
  .actionpill {
    display: inline-block; padding: 3px 12px; border-radius: 999px; font-weight: 700;
    font-size: 13px; color: #06231f; margin: 6px 0;
  }
  .a-RAISE { background: var(--raise); } .a-CALL { background: var(--call); }
  .a-FOLD { background: var(--fold); } .a-CHECK { background: var(--check); }
  .a-ALL_IN { background: var(--allin); color: #fff; }
  .reason { font-size: 13px; line-height: 1.5; color: #d7e0ee; font-style: italic; }
  .flag { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; margin-right: 5px; }
  .flag.retry { background: #3a3357; color: #cbb8ff; }
  .flag.fallback { background: #533737; color: #ffb8b8; }
  .flag.apifail { background: #5a2020; color: #ff9d9d; }
  .flag.allin { background: #5a2030; color: #ff9db3; }

  .toolev { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 8px; background: var(--panel-2); }
  .toolev .th { font-weight: 700; font-size: 12px; color: var(--accent); }
  .toolev .peek { color: var(--gold); }
  .ratebar { display: flex; align-items: center; gap: 6px; font-size: 11px; margin-top: 3px; }
  .ratebar .lab { width: 34px; color: var(--muted); text-transform: capitalize; }
  .ratebar .track { flex: 1; height: 7px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .ratebar .fill { height: 100%; background: var(--accent); }
  .ratebar .val { width: 34px; text-align: right; font-variant-numeric: tabular-nums; }

  #toolUsedLine {
    font-size: 13px; line-height: 1.5; margin-bottom: 10px; padding: 8px 10px;
    background: var(--panel-2); border: 1px solid var(--accent); border-radius: 8px;
  }
  #toolUsedLine .ok { color: var(--gold); font-weight: 700; }
  #toolUsedLine .bad { color: var(--red); font-weight: 600; }

  #log .street-h { font-size: 11px; text-transform: uppercase; color: var(--accent); margin: 8px 0 4px; letter-spacing: .5px; }
  .logrow { display: flex; gap: 8px; font-size: 12px; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,.04); }
  .logrow.dim { opacity: .38; }
  .logrow.cur { background: rgba(240,193,75,.10); border-radius: 4px; }
  .logrow .who { width: 90px; color: var(--muted); flex-shrink: 0; }
  .logrow .act { font-weight: 600; }

  /* Judge modal */
  #judgeModal {
    display: none; position: fixed; inset: 0; background: rgba(6,10,18,.82);
    z-index: 50; padding: 30px; overflow-y: auto;
  }
  #judgeModal .sheet { max-width: 1100px; margin: 0 auto; }
  #judgeModal .close { position: sticky; top: 0; float: right; }
  .jgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px,1fr)); gap: 14px; margin-top: 10px; }
  .jcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .jcard h3 { margin: 0; display: flex; justify-content: space-between; align-items: center; }
  .overall { font-size: 22px; font-weight: 800; color: var(--gold); }
  .dim { margin-top: 10px; }
  .dim .row { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; }
  .dim .rat { font-size: 12px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
  .scorechip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
  .podium { display: flex; gap: 12px; justify-content: center; margin: 14px 0; }
  .podium .p { text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 18px; }
  .podium .rank { font-size: 22px; }

  /* AI Arena presentation theme */
  :root {
    --bg: #080713;
    --panel: #121027;
    --panel-2: #1b1740;
    --line: rgba(174, 161, 255, .18);
    --text: #f8f7ff;
    --muted: #a5a0c2;
    --accent: #b9ff66;
    --felt: #342b82;
    --felt-2: #161146;
    --gold: #ffd467;
    --red: #ff668f;
    --raise: #ff9466;
    --call: #73c7ff;
    --fold: #9c98b7;
    --check: #73e5ba;
    --allin: #ff668f;
    --violet: #8b6cff;
    --cyan: #55e8ef;
  }
  * { scrollbar-color: #3a3267 transparent; }
  html { background: var(--bg); }
  body {
    display: flex;
    min-width: 320px;
    flex-direction: column;
    background:
      radial-gradient(circle at 22% -10%, rgba(139, 108, 255, .28), transparent 33%),
      radial-gradient(circle at 92% 14%, rgba(85, 232, 239, .13), transparent 27%),
      linear-gradient(155deg, #0b091d 0%, #070611 70%);
    font-family: "Avenir Next", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
  }
  body::before {
    position: fixed;
    inset: 0;
    z-index: -1;
    content: "";
    opacity: .22;
    background-image: radial-gradient(rgba(255, 255, 255, .18) .7px, transparent .7px);
    background-size: 22px 22px;
    mask-image: linear-gradient(to bottom, #000, transparent 75%);
  }
  header {
    position: relative;
    z-index: 30;
    display: grid;
    min-height: 88px;
    padding: 13px 22px;
    grid-template-columns: auto minmax(320px, 620px) 160px 1fr auto;
    gap: 20px;
    border-bottom: 1px solid rgba(255, 255, 255, .08);
    background: rgba(8, 7, 19, .82);
    box-shadow: 0 16px 50px rgba(0, 0, 0, .26);
    backdrop-filter: blur(20px);
  }
  .arena-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    white-space: nowrap;
  }
  .arena-logo {
    position: relative;
    display: grid;
    width: 50px;
    height: 50px;
    place-items: center;
    overflow: hidden;
    border: 1px solid rgba(185, 255, 102, .55);
    border-radius: 16px 5px 16px 5px;
    color: #161c0b;
    font-size: 26px;
    background: linear-gradient(145deg, #d9ff9d, #9ced48);
    box-shadow: 0 0 30px rgba(185, 255, 102, .18);
    transform: rotate(-3deg);
  }
  .arena-logo::after {
    position: absolute;
    inset: auto -8px -13px auto;
    width: 32px;
    height: 32px;
    border: 6px solid rgba(255, 255, 255, .24);
    border-radius: 50%;
    content: "";
  }
  .arena-brand h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -.025em;
  }
  .arena-brand p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .18em;
    text-transform: uppercase;
  }
  .tournament-switcher {
    display: grid;
    min-width: 0;
    padding: 8px 12px;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: center;
    gap: 12px;
    border: 1px solid rgba(139, 108, 255, .40);
    border-radius: 14px;
    background:
      linear-gradient(125deg, rgba(139, 108, 255, .16), rgba(85, 232, 239, .04)),
      rgba(19, 16, 43, .90);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), 0 10px 30px rgba(0, 0, 0, .14);
  }
  .tournament-label {
    display: flex;
    flex-direction: column;
    color: var(--accent);
    font-size: 9px;
    font-weight: 850;
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  .tournament-label span {
    margin-top: 3px;
    color: #fff;
    font-size: 13px;
    letter-spacing: 0;
    text-transform: none;
  }
  #tourSel {
    display: block;
    width: 100%;
    min-width: 0;
    height: 42px;
    padding: 0 40px 0 13px;
    border: 1px solid rgba(255, 255, 255, .17);
    border-radius: 10px;
    color: #fff;
    font-size: 13px;
    font-weight: 650;
    background: #0d0b22;
    cursor: pointer;
  }
  .hand-switcher {
    position: relative;
    z-index: 45;
    display: grid;
    visibility: visible;
    min-width: 150px;
    padding: 8px 10px;
    align-items: center;
    gap: 5px;
    border: 1px solid rgba(185, 255, 102, .38);
    border-radius: 14px;
    background:
      linear-gradient(135deg, rgba(185, 255, 102, .10), rgba(85, 232, 239, .035)),
      rgba(19, 16, 43, .90);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), 0 10px 30px rgba(0, 0, 0, .14);
    opacity: 1;
  }
  .hand-switcher label {
    color: var(--accent);
    font-size: 9px;
    font-weight: 850;
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  #handSel {
    display: block;
    visibility: visible;
    width: 100%;
    min-width: 0;
    height: 36px;
    padding: 0 32px 0 11px;
    border: 1px solid rgba(255, 255, 255, .17);
    border-radius: 9px;
    color: #fff;
    font-size: 13px;
    font-weight: 750;
    background: #0d0b22;
    cursor: pointer;
    color-scheme: dark;
    opacity: 1;
  }
  #handSel option,
  #tourSel option {
    color: #fff;
    background: #0d0b22;
  }
  header .meta { display: none; }
  header .spacer { min-width: 0; }
  button, select {
    border-color: rgba(255, 255, 255, .14);
    border-radius: 10px;
    color: var(--text);
    background: linear-gradient(180deg, #24204a, #171332);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06);
    transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
  }
  button:hover:not(:disabled) {
    transform: translateY(-1px);
    border-color: var(--cyan);
    box-shadow: 0 8px 22px rgba(0, 0, 0, .28), 0 0 0 1px rgba(85, 232, 239, .15);
  }
  button:focus-visible, select:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
  button.primary {
    border-color: var(--accent);
    color: #141a0a;
    background: linear-gradient(145deg, #d4ff9d, var(--accent));
    box-shadow: 0 8px 25px rgba(185, 255, 102, .18);
  }
  #judgeBtn {
    min-height: 44px;
    padding-inline: 17px;
    border-color: rgba(185, 255, 102, .30);
    color: var(--accent);
  }
  #loader {
    flex: 1;
    height: auto;
  }
  #loader .drop {
    border-color: rgba(185, 255, 102, .45);
    border-radius: 24px 8px 24px 8px;
    background: linear-gradient(145deg, rgba(36, 31, 78, .96), rgba(14, 12, 36, .98));
    box-shadow: 0 30px 90px rgba(0, 0, 0, .42);
  }
  #app {
    min-height: 0;
    height: auto;
    flex: 1;
    flex-direction: column;
  }
  #controls {
    position: relative;
    z-index: 20;
    flex: 0 0 auto;
    gap: 13px;
    padding: 10px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, .07);
    background: rgba(12, 10, 29, .88);
    backdrop-filter: blur(15px);
  }

<header>
  <div class="arena-brand">
    <div class="arena-logo" aria-hidden="true">♠</div>
    <div>
      <h1>PokerMind Arena</h1>
      <p>Agent tournament broadcast</p>
    </div>
  </div>
  <div class="tournament-switcher">

  </div>
  <div class="hand-switcher">

    <select id="handSel" title="Choose a hand to observe" aria-label="Choose a hand"></select>
  </div>
  <span class="meta" id="hdrMeta"></span>
  <span class="spacer"></span>
  <button id="judgeBtn" style="display:none">⚖ Judge scores</button>
  <button id="loadOtherBtn" style="display:none">Load other…</button>
</header>

<div id="loader">
  <div class="drop">
    <h2>Load a tournament</h2>
    <p>Select a <code>tournament_*.json</code> file to replay it step by step.</p>
    <input type="file" id="fileInput" accept="application/json,.json" />
  </div>
</div>

<div id="app">
  <div id="controls">
    <div class="grp">
      <button id="firstBtn" title="First step">⏮</button>
      <button id="prevBtn" title="Previous">◀ Prev</button>
      <button id="playBtn" class="primary" title="Play/Pause">▶ Play</button>
      <button id="nextBtn" title="Next">Next ▶</button>
      <button id="lastBtn" title="Last step">⏭</button>
    </div>
    <div class="grp">
      <span class="label">Speed</span>
      <input type="range" id="speed" min="1" max="10" value="5" />
    </div>
    <span class="spacer" style="flex:1"></span>
    <span id="streetBadge">—</span>
    <span id="stepInfo">0 / 0</span>
  </div>
  <div id="replayProgress" aria-hidden="true"><div id="replayProgressBar"></div></div>

  <div id="main">
    <div id="tableWrap">
      <div id="table">
        <div id="handTitle"></div>
        <div id="boardLabel">Community cards</div>
        <div id="board"></div>
        <div id="potInfo"><div class="pot"></div><div class="blinds"></div></div>
        <div id="centerResult"></div>
        <!-- seats injected -->
      </div>
    </div>

    <div id="side">
      <div class="card-box" id="decBox">
        <h3>Decision</h3>
        <div id="decAgent">—</div>
        <div id="decAction"></div>
        <div id="decFlags"></div>
        <div class="reason" id="decReason"></div>
      </div>
      <div class="card-box" id="toolBox" style="display:none">
        <h3>🔧 Tools used this step</h3>
        <div id="toolUsedLine"></div>
        <div id="toolEvents"></div>
      </div>
      <div class="card-box">
        <h3>Action log — this hand</h3>
        <div id="log"></div>
      </div>
    </div>
  </div>
</div>

<div id="judgeModal">
  <div class="sheet">
    <button class="close" id="judgeClose">✕ Close</button>
    <h2>LLM Judge evaluations</h2>
    <div id="podium" class="podium"></div>
    <div class="jgrid" id="judgeGrid"></div>
  </div>
</div>

  d.innerHTML = `<div class="r">${RANK[rank]||rank}</div><div class="s">${info.g}</div>`;
  return d;
}

// ----- winning-combination evaluator -----
function rankVal(code) {
  const r = code.slice(0, -1);
  return ({ T: 10, J: 11, Q: 12, K: 13, A: 14 })[r] || Number(r);
}
function cardHTML(code, small = true) {
  const rank = code.slice(0, -1), suit = code.slice(-1);
  const info = SUIT[suit] || { g: "?", red: false };
  return `<div class="card ${small ? "sm" : ""} ${info.red ? "red" : ""}"><div class="r">${RANK[rank] || rank}</div><div class="s">${info.g}</div></div>`;
}
function resultCardHTML(code, small = true) {
  if (code) return cardHTML(code, small);
  return `<div class="card ${small ? "sm" : ""} back result-placeholder" title="Community card was not dealt"><div class="r">?</div></div>`;
}
function kcomb(arr, k) {
  const res = [];
  (function go(start, combo) {
    if (combo.length === k) { res.push(combo.slice()); return; }
    for (let i = start; i < arr.length; i++) { combo.push(arr[i]); go(i + 1, combo); combo.pop(); }
  })(0, []);
  return res;
}
function cmp(a, b) {
  for (let i = 0; i < Math.max(a.length, b.length); i++) {
    const x = a[i] || 0, y = b[i] || 0;
    if (x !== y) return x - y;
  }
  return 0;
}
function score5(cards) {
  const rs = cards.map(c => c.r).sort((a, b) => b - a);
  const suits = cards.map(c => c.s);
  const isFlush = suits.every(s => s === suits[0]);
  const cnt = {};
  rs.forEach(r => cnt[r] = (cnt[r] || 0) + 1);
  const groups = Object.entries(cnt).map(([r, c]) => [c, Number(r)]).sort((a, b) => b[0] - a[0] || b[1] - a[1]);
  const uniq = [...new Set(rs)];
  let straightHigh = 0;
  if (uniq.length === 5) {
    if (uniq[0] - uniq[4] === 4) straightHigh = uniq[0];
    else if (uniq[0] === 14 && uniq[1] === 5 && uniq[4] === 2) straightHigh = 5; // wheel
  }
  const isStraight = straightHigh > 0;
  const kick = groups.map(g => g[1]);
  if (isStraight && isFlush) return [8, straightHigh];
  if (groups[0][0] === 4) return [7, groups[0][1], groups[1][1]];
  if (groups[0][0] === 3 && groups[1][0] === 2) return [6, groups[0][1], groups[1][1]];
  if (isFlush) return [5, ...rs];
  if (isStraight) return [4, straightHigh];
  if (groups[0][0] === 3) return [3, ...kick];
  if (groups[0][0] === 2 && groups[1][0] === 2) return [2, groups[0][1], groups[1][1], groups[2][1]];
  if (groups[0][0] === 2) return [1, ...kick];
  return [0, ...rs];
}
function best5(codes) {
  const cards = codes.map(c => ({ r: rankVal(c), s: c.slice(-1), code: c }));
  const idxs = cards.map((_, i) => i);
  let best = null;
  for (const combo of kcomb(idxs, 5)) {
    const hand = combo.map(i => cards[i]);
    const s = score5(hand);
    if (!best || cmp(s, best.score) > 0) best = { score: s, cards: hand.map(c => c.code) };
  }
  return best;
}
function categoryLabel(score) {
  const names = ["High card", "Pair", "Two pair", "Three of a kind", "Straight", "Flush", "Full house", "Four of a kind", "Straight flush"];
  if (score[0] === 8 && score[1] === 14) return "Royal flush";
  return names[score[0]] || "—";
}
function computeCombo(h) {
  const winnersArr = h.winners || [];
  if (!winnersArr.length) return null;
  const wseat = String(winnersArr[0]);
  const hasShowdown = Object.keys(h.showdown_results || {}).length > 0;
  const hole = h.hole_cards[wseat] || [];
  const availableCards = [...hole, ...(h.board || [])];
  if (availableCards.length >= 5) {
    const b = best5(availableCards);
    return {
      winnerSeat: wseat,
      cards: new Set(b.cards),
      holeCards: hole,
      resultCards: b.cards,
      label: categoryLabel(b.score),
      uncontested: !hasShowdown,
      incomplete: false,
    };
  }
  const resultCards = [...hole];
  while (resultCards.length < 5) resultCards.push(null);
  return {
    winnerSeat: wseat,
    cards: new Set(hole),
    holeCards: hole,
    resultCards,
    label: "Uncontested win",
    uncontested: true,
    incomplete: true,
  };
}

function buildFrames(data) {
  const frames = [];
  data.hands.forEach((h, hi) => {
    frames.push({ type: "hand-start", hi });
    (h.decisions || []).forEach((_, di) => frames.push({ type: "decision", hi, di }));
    frames.push({ type: "hand-end", hi });
  });
  return frames;
}

// Which seats folded up to and including decision index `upto` in hand h.
function foldedThrough(h, upto) {
  const folded = new Set();
  for (let i = 0; i <= upto && i < h.decisions.length; i++) {
    const d = h.decisions[i];
    const act = (d.final_executed && d.final_executed.ACTION) || d.ACTION;
    if (act === "FOLD") folded.add(String(d.actor_seat));
  }
  return folded;
}

function seatContribAtStart(h) {
  // pot after blinds are posted
  return (h.forced_blinds || []).reduce((s, b) => s + (b.posted || 0), 0);
}

function positionsBadges(pos, seat) {
  const b = [];
  if (pos.button === seat) b.push(["btn","D"]);
  if (pos.small_blind === seat) b.push(["sb","SB"]);
  if (pos.big_blind === seat) b.push(["bb","BB"]);
  return b;
}

function clearChipFlights() {
  document.querySelectorAll(".chip-flight").forEach(el => el.remove());
  document.getElementById("potInfo").classList.remove("receive");
}

function animateChipTransfer(seat, amount, delay, generation) {
  if (!amount || generation !== chipAnimationGeneration) return;
  const table = document.getElementById("table");
  const seatEl = table.querySelector(`.seat-${seat}`);
  const potEl = document.querySelector("#potInfo .pot");
  if (!seatEl || !potEl) return;

  const tableRect = table.getBoundingClientRect();
  const seatRect = seatEl.getBoundingClientRect();
  const potRect = potEl.getBoundingClientRect();
  const startX = seatRect.left + seatRect.width / 2 - tableRect.left;
  const startY = seatRect.top + seatRect.height / 2 - tableRect.top;
  const endX = potRect.left + potRect.width / 2 - tableRect.left;
  const endY = potRect.top + potRect.height / 2 - tableRect.top;
  const dx = endX - startX;
  const dy = endY - startY;
  const arc = Math.min(82, Math.max(38, Math.abs(dx) * 0.13));

  const flight = document.createElement("div");
  flight.className = `chip-flight from-seat-${seat}`;
  flight.style.left = `${startX}px`;
  flight.style.top = `${startY}px`;
  flight.setAttribute("aria-hidden", "true");

  const stack = document.createElement("span");
  stack.className = "flying-chip-stack";
  for (let i = 0; i < 3; i++) {
    const chip = document.createElement("span");
    chip.className = "flying-chip";
    stack.appendChild(chip);
  }
  const amountLabel = document.createElement("span");
  amountLabel.className = "chip-flight-amount";
  amountLabel.textContent = `+${amount}`;
  flight.append(stack, amountLabel);
  table.appendChild(flight);

  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const duration = reducedMotion ? 320 : 720;
  const animation = flight.animate(
    [
      { transform: "translate(-50%, -50%) scale(.72)", opacity: 0 },
      { transform: "translate(-50%, -50%) scale(1)", opacity: 1, offset: 0.12 },
      {
        transform: `translate(calc(-50% + ${dx * 0.52}px), calc(-50% + ${dy * 0.52 - arc}px)) rotate(-7deg) scale(1.05)`,
        opacity: 1,
        offset: 0.58,
      },
      {
        transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(5deg) scale(.62)`,
        opacity: 0,
      },
    ],
    {
      duration,
      delay,
      easing: "cubic-bezier(.22,.78,.28,1)",
      fill: "forwards",
    },
  );
  animation.finished.catch(() => {}).finally(() => flight.remove());

  window.setTimeout(() => {
    if (generation !== chipAnimationGeneration) return;
    const potInfo = document.getElementById("potInfo");
    potInfo.classList.remove("receive");
    void potInfo.offsetWidth;
    potInfo.classList.add("receive");
  }, delay + duration * 0.78);
}

function render() {
  const movingForward = idx === lastRenderedIdx + 1;
  const animationGeneration = ++chipAnimationGeneration;
  clearChipFlights();
  const f = FRAMES[idx];
  const h = DATA.hands[f.hi];
  const participants = new Set(Object.keys(h.hole_cards));
  const pos = h.positions;

  // ----- derive per-frame state -----
  HAND_END_COMBO = null;
  let stacks, board, pot, folded, activeSeat, winners = new Set(), revealAll = false;
  let streetLabel, handTitle = `Hand ${h.hand_number} of ${DATA.hands.length}`;

  if (f.type === "hand-start") {
    stacks = Object.assign({}, h.starting_stacks);
    (h.forced_blinds || []).forEach(b => { stacks[String(b.seat)] = b.stack_after; });
    board = []; pot = seatContribAtStart(h);
    folded = new Set(); activeSeat = null; streetLabel = "Blinds posted";
  } else if (f.type === "decision") {
    const d = h.decisions[f.di];
    stacks = d.stacks_after; board = (d.visible_state && d.visible_state.board) || [];
    pot = d.pot_after; folded = foldedThrough(h, f.di);
    activeSeat = String(d.actor_seat); streetLabel = d.street;
  } else { // hand-end
    stacks = h.ending_stacks; board = h.board || []; pot = 0;
    folded = foldedThrough(h, h.decisions.length - 1);
    activeSeat = null; revealAll = true;
    (h.winners || []).forEach(w => winners.add(String(w)));
    streetLabel = Object.keys(h.showdown_results || {}).length ? "Showdown" : "Hand result";
    HAND_END_COMBO = computeCombo(h);
  }

  // ----- header / controls -----
  document.getElementById("streetBadge").textContent = streetLabel;
  document.getElementById("stepInfo").textContent = `${idx + 1} / ${FRAMES.length}`;
  document.getElementById("replayProgressBar").style.width =
    `${FRAMES.length > 1 ? (idx / (FRAMES.length - 1)) * 100 : 100}%`;
  document.getElementById("handSel").value = String(f.hi);
  document.getElementById("handTitle").textContent = handTitle;

  // ----- board -----
  const boardEl = document.getElementById("board");
  boardEl.innerHTML = "";
  const animateFrom = (f.hi === lastHi) ? lastBoardLen : 0; // only flip newly revealed cards
  const winSet = HAND_END_COMBO && HAND_END_COMBO.cards;
  if (board.length === 0) {
    const ph = document.createElement("div");
    ph.style.cssText = "color:#bfe0c8;font-size:12px;opacity:.7";
    ph.textContent = streetLabel === "Blinds posted" ? "Hole cards dealt" : "(no community cards yet)";
    boardEl.appendChild(ph);
  } else {
    board.forEach((c, ci) => {
      const ce = cardEl(c, false, false);
      if (ci >= animateFrom) { ce.classList.add("flip"); ce.style.animationDelay = ((ci - animateFrom) * 0.1) + "s"; }
      if (winSet && winSet.has(c)) ce.classList.add("win-card");
      boardEl.appendChild(ce);
    });
  }
  lastHi = f.hi; lastBoardLen = board.length;

  // ----- pot / blinds -----
  const potEl = document.getElementById("potInfo");
  potEl.querySelector(".pot").textContent = f.type === "hand-end"
    ? `Awarded: ${Object.entries(h.pot_awards || {}).map(([s,v]) => `${seatName[s]} +${v}`).join(", ") || "—"}`
    : `Pot: ${pot}`;
  potEl.querySelector(".blinds").textContent = `Blinds ${h.blinds.small}/${h.blinds.big}`;
  if (f.type !== "hand-end" && lastPot !== null && pot !== lastPot) {
    potEl.classList.remove("bump"); void potEl.offsetWidth; potEl.classList.add("bump");
  }
  lastPot = pot;

  // ----- seats -----
  document.querySelectorAll(".seat").forEach(s => s.remove());
  const table = document.getElementById("table");
  const n = seatList.length;
  const seatRadiusX = window.innerWidth <= 560 ? 31 : 43;
  const seatRadiusY = window.innerWidth <= 560 ? 48 : 40;
  seatList.forEach((seat, i) => {
    // Players not dealt into this hand are eliminated / out — do not render them.
    if (!participants.has(seat)) return;

    const angle = (Math.PI / 2) + (i * 2 * Math.PI / n); // seat0 at bottom
    const x = 50 + seatRadiusX * Math.cos(angle);
    const y = 52 + seatRadiusY * Math.sin(angle);
    const el = document.createElement("div");
    el.className = `seat seat-${seat}`;
    el.style.left = x + "%"; el.style.top = y + "%";
    if (folded.has(seat)) el.classList.add("folded");
    if (activeSeat === seat) el.classList.add("active");
    if (winners.has(seat)) el.classList.add("winner");

    const posB = positionsBadges(pos, Number(seat));
    const badges = posB.map(([c,t]) => `<span class="posbadge ${c}">${t}</span>`).join("");

    // last action label
    let last = "";
    if (f.type === "hand-start") {
      const fb = (h.forced_blinds || []).find(b => String(b.seat) === seat);
      if (fb) last = `posts ${fb.position === "small_blind" ? "small blind" : "big blind"} ${fb.posted}`;
    } else if (f.type === "decision" || f.type === "hand-end") {
      const upto = f.type === "decision" ? f.di : h.decisions.length - 1;
      for (let k = upto; k >= 0; k--) {
        if (String(h.decisions[k].actor_seat) === seat) {
          const dd = h.decisions[k];
          const a = (dd.final_executed && dd.final_executed.ACTION) || dd.ACTION;
          const amt = (dd.final_executed && dd.final_executed.AMOUNT) ?? dd.AMOUNT;
          last = a + (a === "RAISE" || a === "CALL" || a === "ALL_IN" ? " " + amt : "");
          break;
        }
      }
    }
    if (winners.has(seat)) last = "🏆 winner";

    // "tool called right now" badge on the acting seat
    let toolTag = "";
    if (f.type === "decision" && activeSeat === seat) {
      const evs = h.decisions[f.di].tool_events || [];
      if (evs.length) {
        const parts = [];
        const nStats = evs.filter(e => e.tool === "get_opponent_statistics").length;
        if (nStats) parts.push(nStats > 1 ? `📊 stats ×${nStats}` : "📊 stats");
        evs.filter(e => e.tool === "peek_opponent_card").forEach(p =>
          parts.push(p.result && p.result.ok ? "👁 peek" : "👁 peek ✗"));
        toolTag = `<div class="tooltag">🔧 ${parts.join(", ")}</div>`;
      }
    }

    const showdown = (h.showdown_results || {})[seat];
    const sdLabel = (revealAll && showdown) ? `<div class="lastact">${showdown.category}</div>` : "";

    el.innerHTML = `
      <div class="name">${seatName[seat]}</div>
      <div class="stack">${stacks[seat] != null ? stacks[seat] + " chips" : "—"}</div>
      <div class="cards"></div>
      <div class="badges">${badges}</div>
      <div class="lastact">${last}</div>
      ${toolTag}
      ${sdLabel}`;
    const cardsWrap = el.querySelector(".cards");
    const hole = h.hole_cards[seat];
    if (hole) hole.forEach((c, ci) => {
      const ce = cardEl(c, false, false);
      if (f.type === "hand-start") { ce.classList.add("deal"); ce.style.animationDelay = (ci * 0.08) + "s"; }
      if (HAND_END_COMBO && HAND_END_COMBO.winnerSeat === seat && HAND_END_COMBO.cards.has(c)) ce.classList.add("win-card");
      cardsWrap.appendChild(ce);
    });
    table.appendChild(el);
  });

  // ----- center hand-result overlay -----
  const cr = document.getElementById("centerResult");
  const showCenter = f.type === "hand-end" && HAND_END_COMBO;
  // At hand-end, keep the community board visible (esp. for all-in hands whose
  // board only exists at showdown) and lift it above the result panel.
  document.getElementById("table").classList.toggle("result", !!showCenter);
  if (showCenter) {
    const combo = HAND_END_COMBO;
    let inner = "";
    if (idx === FRAMES.length - 1 && DATA.winner) inner += `<div class="cr-champ">👑 TOURNAMENT CHAMPION</div>`;
    inner += `<div class="cr-winner">🏆 ${seatName[combo.winnerSeat]} wins the hand</div>`;
    inner += `<div class="cr-combo-label">${combo.incomplete ? "Result type" : "Winning combination"}</div>` +
             `<div class="cr-cat">${combo.label}</div>` +
             `<div class="cr-cards">${combo.resultCards.map(c => resultCardHTML(c, false)).join("")}</div>`;
    if (combo.uncontested) {
      inner += `<div class="cr-context">${combo.incomplete
        ? "Board cards were not dealt because every opponent folded"
        : "Best five-card hand from the revealed cards · no showdown required"}</div>`;
    }
    const award = (h.pot_awards || {})[combo.winnerSeat];
    if (award) inner += `<div class="cr-award">+${award} chips</div>`;
    cr.innerHTML = inner;
    cr.classList.add("show");
  } else {
    cr.classList.remove("show");
  }

  renderDecision(f, h);
  renderLog(f, h);

  if (movingForward && f.type === "hand-start") {
    (h.forced_blinds || []).forEach((blind, blindIndex) => {
      animateChipTransfer(String(blind.seat), Number(blind.posted || 0), blindIndex * 90, animationGeneration);
    });
  } else if (movingForward && f.type === "decision") {
    const decision = h.decisions[f.di];
    const amount =
      (decision.final_executed && decision.final_executed.AMOUNT) ?? decision.AMOUNT;
    animateChipTransfer(String(decision.actor_seat), Number(amount || 0), 0, animationGeneration);
  }
  lastRenderedIdx = idx;
}

function renderDecision(f, h) {
  const box = document.getElementById("decBox");
  const toolBox = document.getElementById("toolBox");
  if (f.type !== "decision") {
    document.getElementById("decFlags").innerHTML = "";
    if (f.type === "hand-end") {
      document.getElementById("decAgent").textContent = `Hand ${h.hand_number} complete`;
      const combo = HAND_END_COMBO;
      let html = "";
      if (combo) {
        html = `<div class="winlabel">🏆 ${seatName[combo.winnerSeat]} wins the hand — <b>${combo.label}</b>` +
               (combo.uncontested ? ` <span class="muted">(opponents folded)</span>` : "") +
               `</div><div class="winsub">${combo.incomplete ? "Five-card result" : "Winning five-card combination"}</div>` +
               `<div class="combo">${combo.resultCards.map(c => resultCardHTML(c)).join("")}</div>`;
      }
      // Final hand of the tournament → crown the champion.
      const isFinal = idx === FRAMES.length - 1;
      if (isFinal && DATA.winner) {
        html = `<div class="champion">👑 Tournament winner<br><b>${DATA.winner}</b></div>` + html;
      }
      document.getElementById("decAction").innerHTML = html;
      document.getElementById("decReason").textContent =
        (h.eliminations||[]).length ? `Eliminated this hand: ${h.eliminations.map(s=>seatName[String(s)]).join(", ")}` : "";
    } else {
      document.getElementById("decAgent").textContent = `Hand ${h.hand_number}: blinds posted`;
      document.getElementById("decAction").innerHTML = "";
      const blindTxt = (h.forced_blinds||[])
        .map(b => `${b.player} posts the ${b.position === "small_blind" ? "small blind" : "big blind"} (${b.posted})`)
        .join(" · ");
      document.getElementById("decReason").textContent =
        (blindTxt ? blindTxt + ". " : "") +
        `Cards dealt to ${Object.keys(h.hole_cards).map(s=>seatName[s]).join(", ")}.`;
    }
    toolBox.style.display = "none";
    return;
  }
  const d = h.decisions[f.di];
  const act = (d.final_executed && d.final_executed.ACTION) || d.ACTION;
  const amt = (d.final_executed && d.final_executed.AMOUNT) ?? d.AMOUNT;
  const reason = (d.final_executed && d.final_executed.REASON) || d.REASON || "";
  document.getElementById("decAgent").textContent = `${d.agent} (seat ${d.actor_seat})`;
  const amtStr = (act === "RAISE" || act === "CALL" || act === "ALL_IN") ? " " + amt : "";
  document.getElementById("decAction").innerHTML =
    `<span class="actionpill a-${act}">${act}${amtStr}</span>`;
  const flags = [];
  if (d.all_in) flags.push(`<span class="flag allin">ALL-IN</span>`);
  if (d.retry_used) flags.push(`<span class="flag retry">RETRIED</span>`);
  if (d.fallback_used) flags.push(`<span class="flag fallback">SAFE FALLBACK</span>`);
  if (d.api_failed) flags.push(`<span class="flag apifail">API FAILED</span>`);
  document.getElementById("decFlags").innerHTML = flags.join("");
  document.getElementById("decReason").textContent = reason ? `“${reason}”` : "(no reason recorded)";

  // tool events
  const evs = d.tool_events || [];
  if (evs.length) {
    toolBox.style.display = "";
    document.getElementById("toolUsedLine").innerHTML = `used: ${toolUsedSummary(evs)}`;
    document.getElementById("toolEvents").innerHTML = evs.map(renderToolEvent).join("");
  } else {
    toolBox.style.display = "none";
  }
}

function renderToolEvent(ev) {
  const r = ev.result || {};
  if (ev.tool === "peek_opponent_card") {
    const card = r.ok ? r.card : null;
    return `<div class="toolev"><div class="th peek">👁 peek_opponent_card → ${ev.input && ev.input.opponent || "?"}</div>` +
      (r.ok ? `<div style="margin-top:4px">Revealed card: <b>${card}</b> (one-time peek)</div>`
            : `<div style="margin-top:4px;color:var(--red)">✗ ${r.error || "unavailable"}</div>`) + `</div>`;
  }
  // get_opponent_statistics
  if (!r.ok) return `<div class="toolev"><div class="th">📊 get_opponent_statistics</div><div style="color:var(--red)">✗ ${r.error||"error"}</div></div>`;
  const rates = r.rates || {};
  const bars = ["fold","call","check","raise"].map(k => {
    const v = rates[k] || 0;
    return `<div class="ratebar"><span class="lab">${k}</span><span class="track"><span class="fill" style="width:${Math.round(v*100)}%"></span></span><span class="val">${Math.round(v*100)}%</span></div>`;
  }).join("");
  return `<div class="toolev"><div class="th">📊 get_opponent_statistics → ${r.opponent||"?"}</div>` +
    `<div style="font-size:11px;color:var(--muted);margin:2px 0">${r.decisions||0} decisions · aggression ${Math.round((r.aggression_frequency||0)*100)}% · voluntary ${r.voluntary_chips||0}</div>` +
    bars + `</div>`;
}

function renderLog(f, h) {
  const log = document.getElementById("log");
  log.innerHTML = "";
  const curDi = f.type === "decision" ? f.di
    : f.type === "hand-end" ? h.decisions.length - 1 : -1;
  let lastStreet = null;
  h.decisions.forEach((d, di) => {
    if (d.street !== lastStreet) {
      lastStreet = d.street;
      const sh = document.createElement("div");
      sh.className = "street-h"; sh.textContent = d.street;
      log.appendChild(sh);
    }
    const act = (d.final_executed && d.final_executed.ACTION) || d.ACTION;
    const amt = (d.final_executed && d.final_executed.AMOUNT) ?? d.AMOUNT;
    const row = document.createElement("div");
    row.className = "logrow" + (di > curDi ? " dim" : "") + (di === curDi ? " cur" : "");
    const amtStr = (act === "RAISE" || act === "CALL" || act === "ALL_IN") ? " " + amt : "";
    const toolMark = (d.tool_events || []).length ? `<span class="toolmark" title="used a tool">🔧</span>` : "";
    row.innerHTML = `<span class="who">${d.agent}</span><span class="act a-txt">${act}${amtStr}</span>${toolMark}`;
    log.appendChild(row);
  });
  if (f.type === "hand-end" && curDi >= 0) {
    const el = log.querySelectorAll(".logrow")[curDi];
    if (el && window.innerWidth > 820) {
      const side = document.getElementById("side");
      const sideRect = side.getBoundingClientRect();
      const rowRect = el.getBoundingClientRect();
      if (rowRect.bottom > sideRect.bottom) {
        side.scrollTop += rowRect.bottom - sideRect.bottom + 12;
      } else if (rowRect.top < sideRect.top) {
        side.scrollTop -= sideRect.top - rowRect.top + 12;
      }
    }
  }
}

// Concise "used: ..." summary of the tools called in a single decision/step.
function toolUsedSummary(evs) {
  const parts = [];
  const stats = evs.filter(e => e.tool === "get_opponent_statistics");
  const peeks = evs.filter(e => e.tool === "peek_opponent_card");
  if (stats.length) {
    const opps = [...new Set(stats.map(e => e.input && e.input.opponent).filter(Boolean))];
    parts.push(`📊 opponent statistics ×${stats.length}${opps.length ? " (" + opps.join(", ") + ")" : ""}`);
  }
  peeks.forEach(p => {
    const opp = (p.input && p.input.opponent) || "?";
    if (p.result && p.result.ok) {
      parts.push(`👁 <span class="ok">peek ${opp} → ${p.result.card}</span>`);
    } else {
      const why = shortPeekError((p.result && p.result.error) || "not executed");
      parts.push(`👁 <span class="bad">peek ${opp} not executed — ${why}</span>`);
    }
  });
  return parts.join(" · ");
}

// Human-friendly reason for a rejected peek.
function shortPeekError(err) {
  const e = String(err).toLowerCase();
  if (e.includes("tool call limit")) return "hit this step's tool-call limit";
  if (e.includes("already")) return "one-time peek already used";
  return err;
}

// ----- judge panel -----
function renderJudge() {
  const grid = document.getElementById("judgeGrid");
  const evals = DATA.judge_evaluations || [];
  const DIMS = [
    ["decision_quality","Decision quality"], ["reason_quality","Reason quality"],
    ["strategy_consistency","Strategy consistency"], ["adaptation","Adaptation"],
  ];
  grid.innerHTML = evals.map(je => {
    const e = je.evaluation || {};
    const dims = DIMS.filter(([k]) => e[k]).map(([k,label]) =>
      `<div class="dim"><div class="row"><span>${label}</span><span class="scorechip">${e[k].score}/10</span></div><div class="rat">${e[k].rationale||""}</div></div>`
    ).join("");
    const tu = e.tool_usage || {};
    const tuHtml = tu.applicable
      ? `<div class="dim"><div class="row"><span>Tool usage</span><span class="scorechip">${tu.score}/10</span></div><div class="rat">${tu.rationale||""}</div></div>`
      : `<div class="dim"><div class="row"><span>Tool usage</span><span class="scorechip">n/a</span></div></div>`;
    const best = e.strongest_decision, worst = e.weakest_decision;
    const refs = (best||worst) ? `<div class="dim"><div class="rat">` +
      (best ? `<b style="color:var(--check)">Strongest</b> (H${best.hand_number}, ${best.street}): ${best.explanation}<br>` : "") +
      (worst ? `<b style="color:var(--red)">Weakest</b> (H${worst.hand_number}, ${worst.street}): ${worst.explanation}` : "") +
      `</div></div>` : "";
    const imp = e.main_improvement ? `<div class="dim"><div class="row"><span>Main improvement</span></div><div class="rat">${e.main_improvement}</div></div>` : "";
    return `<div class="jcard"><h3><span>${je.player}</span><span class="overall">${e.overall_score ?? "—"}/10</span></h3>
      <div style="font-size:11px;color:var(--muted)">judge: ${je.model||""}</div>
      ${dims}${tuHtml}${refs}${imp}</div>`;
  }).join("");

  // podium
  const pod = document.getElementById("podium");
  const medals = {1:"🥇",2:"🥈",3:"🥉"};
  const placements = DATA.placements || {};
  pod.innerHTML = Object.entries(placements).sort((a,b)=>a[1]-b[1]).map(([name,rank]) =>
    `<div class="p"><div class="rank">${medals[rank]||rank}</div><div>${name}</div><div style="color:var(--muted);font-size:12px">${name===DATA.winner?"winner":"place "+rank}</div></div>`
  ).join("");
}

// ----- controls -----
function goto(i) { idx = Math.max(0, Math.min(FRAMES.length - 1, i)); render(); updateButtons(); }
function updateButtons() {
  document.getElementById("prevBtn").disabled = idx === 0;
  document.getElementById("firstBtn").disabled = idx === 0;
  document.getElementById("nextBtn").disabled = idx === FRAMES.length - 1;
  document.getElementById("lastBtn").disabled = idx === FRAMES.length - 1;
}
function stepDelay() {
  const v = Number(document.getElementById("speed").value); // 1..10
  return 1650 - (v - 1) * 90; // 1650ms .. 840ms
}
function play() {
  if (timer) { pause(); return; }
  document.getElementById("playBtn").textContent = "⏸ Pause";
  const tick = () => {
    if (idx >= FRAMES.length - 1) { pause(); return; }
    goto(idx + 1);
    timer = setTimeout(tick, stepDelay());
  };
  timer = setTimeout(tick, stepDelay());
}
function pause() {
  if (timer) clearTimeout(timer);
  timer = null;
  document.getElementById("playBtn").textContent = "▶ Play";
}

function init(data) {
  pause();
  DATA = data;
  lastHi = -1; lastBoardLen = 0; lastPot = null; HAND_END_COMBO = null;
  lastRenderedIdx = -1; chipAnimationGeneration += 1; clearChipFlights();
  seatList = data.players.map(p => String(p.seat)).sort((a,b)=>Number(a)-Number(b));
  seatName = {};
  data.players.forEach(p => seatName[String(p.seat)] = p.name);
  FRAMES = buildFrames(data);
  idx = 0;

  document.getElementById("hdrMeta").textContent =
    `${data.tournament_id} · ${data.hands.length} hands · winner: ${data.winner || "—"}`;
  const handSel = document.getElementById("handSel");
  handSel.innerHTML = data.hands.map((h, hi) => `<option value="${hi}">Hand ${h.hand_number}</option>`).join("");
  handSel.hidden = false;
  handSel.style.display = "block";
  handSel.style.visibility = "visible";
  handSel.disabled = data.hands.length === 0;

  document.getElementById("loader").style.display = "none";
  document.getElementById("app").style.display = "flex";
  document.getElementById("judgeBtn").style.display = (data.judge_evaluations||[]).length ? "" : "none";
  document.getElementById("loadOtherBtn").style.display = EMBEDDED ? "none" : "";

  if ((data.judge_evaluations||[]).length) renderJudge();
  render(); updateButtons();
}

// Accept a single tournament object or an array; wire up the tournament selector.
function bootstrap(embedded) {
  const list = Array.isArray(embedded) ? embedded : [embedded];
  TOURNAMENTS = list.filter(d => d && Array.isArray(d.hands));
  if (!TOURNAMENTS.length) { showLoader(); return; }
  const sel = document.getElementById("tourSel");
  if (TOURNAMENTS.length > 1) {
    sel.style.display = "";
    sel.innerHTML = TOURNAMENTS.map((d, i) =>
      `<option value="${i}">${d.tournament_id} · ${d.hands.length} hands · winner ${d.winner || "?"}</option>`
    ).join("");
    sel.onchange = e => init(TOURNAMENTS[Number(e.target.value)]);
  } else {
    sel.style.display = "none";
  }
  init(TOURNAMENTS[0]);
  applyHash();
}

function showLoader() {
  document.getElementById("app").style.display = "none";
  document.getElementById("loader").style.display = "flex";
}

// Deep-link support for presenting: #t=I (tournament index), #step=N (1-based), #hand=N, #judge
function applyHash() {
  const hash = location.hash.replace(/^#/, "");
  if (!hash) return;
  const parts = Object.fromEntries(hash.split("&").map(p => p.split("=")));
  if ("t" in parts && TOURNAMENTS[Number(parts.t)]) {
    document.getElementById("tourSel").value = String(Number(parts.t));
    init(TOURNAMENTS[Number(parts.t)]);
  }
  if ("step" in parts) goto(Number(parts.step) - 1);
  else if ("hand" in parts) {
    const fi = FRAMES.findIndex(f => f.hi === Number(parts.hand) - 1 && f.type === "hand-start");
    if (fi >= 0) goto(fi);
  }
  if ("judge" in parts && (DATA.judge_evaluations||[]).length)
    document.getElementById("judgeModal").style.display = "block";
}

// wire up
document.getElementById("firstBtn").onclick = () => { pause(); goto(0); };
document.getElementById("lastBtn").onclick = () => { pause(); goto(FRAMES.length - 1); };
document.getElementById("prevBtn").onclick = () => { pause(); goto(idx - 1); };
document.getElementById("nextBtn").onclick = () => { pause(); goto(idx + 1); };
document.getElementById("playBtn").onclick = () => play();
document.getElementById("handSel").onchange = (e) => {
  pause();
  const hi = Number(e.target.value);
  const fi = FRAMES.findIndex(f => f.hi === hi && f.type === "hand-start");
  if (fi >= 0) goto(fi);
};
document.getElementById("judgeBtn").onclick = () => { document.getElementById("judgeModal").style.display = "block"; };
document.getElementById("judgeClose").onclick = () => { document.getElementById("judgeModal").style.display = "none"; };
document.getElementById("loadOtherBtn").onclick = () => {
  document.getElementById("app").style.display = "none";
  document.getElementById("loader").style.display = "flex";
};
document.addEventListener("keydown", (e) => {
  if (document.getElementById("app").style.display === "none") return;
  if (e.key === "ArrowRight") { pause(); goto(idx + 1); }
  else if (e.key === "ArrowLeft") { pause(); goto(idx - 1); }
  else if (e.key === " ") { e.preventDefault(); play(); }
});
document.getElementById("fileInput").onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try { init(JSON.parse(reader.result)); }
    catch (err) { alert("Could not parse JSON: " + err.message); }
  };
  reader.readAsText(file);
};

if (EMBEDDED) bootstrap(EMBEDDED);
</script>
